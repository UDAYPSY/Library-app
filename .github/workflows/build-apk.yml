name: Build Android APK and Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Scaffolding and Dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.example.library_manager --project-name library_manager --platforms android .
          cp pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart
          python3 .github/scripts/patch_android_gradle.py
          flutter pub get

      - name: Run Automated Test Suite
        run: |
          set -e -o pipefail
          flutter test 2>&1 | tee test_run.log

      - name: Decode Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/trackmylibrary-release.jks

      - name: Compile Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e -o pipefail
          flutter build apk --release --no-tree-shake-icons -v 2>&1 | tee apk_build.log
          echo "=== APK files built ==="
          ls -la build/app/outputs/flutter-apk/ || true

      - name: Save Failure Diagnostics
        if: failure()
        run: |
          echo "==================== BUILD FAILED ===================="
          tail -n 250 apk_build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-error-log
          [ -f apk_build.log ] && cp apk_build.log CI_FAILURE.txt || echo "No apk_build.log" > CI_FAILURE.txt
          [ -f test_run.log ] && cp test_run.log CI_TEST_FAILURE.txt || true
          git add -f CI_FAILURE.txt CI_TEST_FAILURE.txt
          git commit -m "ci: build failure diagnostics [skip ci]"
          git push -f origin ci-error-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk_build.log
          if-no-files-found: ignore

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: library-manager-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish Release with APK Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Library Manager Latest Release APK"
          body: |
            ### 📱 Library Manager Android APK
            Automated release build with the latest fee management, shift-wise seat allotment, and data synchronization features.
            
            - **Direct Download**: Download `app-release.apk` below directly to your device.
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Scaffolding and Dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.example.library_manager --project-name library_manager --platforms web .
          cp pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Run Automated Test Suite
        run: |
          flutter test 2>&1 | tee test_run.log || {
            echo "==================== TEST FAILURE LOG ===================="
            tail -n 150 test_run.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-error-log
            cp test_run.log CI_FAILURE.log
            git add CI_FAILURE.log
            git commit -m "ci: test suite failure log"
            git push -f origin ci-error-log || true
            exit 1
          }

      - name: Compile Flutter Web
        run: |
          flutter build web --release --base-href "/" 2>&1 | tee web_build.log || {
            echo "==================== WEB BUILD FAILURE LOG ===================="
            tail -n 150 web_build.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-error-log
            cp web_build.log CI_FAILURE.log
            git add CI_FAILURE.log
            git commit -m "ci: web build failure log"
            git push -f origin ci-error-log || true
            exit 1
          }

      - name: Upload Web Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
        continue-on-error: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true