name: Build Android APK and Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Scaffolding and Dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.example.library_manager --project-name library_manager --platforms android .
          cp pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart
          # Ensure Android minimum SDK satisfies Cloud Firestore (minSdk 23) in both Groovy and Kotlin DSL
          echo "flutter.minSdkVersion=23" >> android/local.properties || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = [0-9]*/minSdk = 23/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/g' {} + || true
          flutter pub get

      - name: Run Automated Test Suite
        run: flutter test

      - name: Compile Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: library-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Scaffolding and Dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.example.library_manager --project-name library_manager --platforms web .
          cp pubspec.yaml.bak pubspec.yaml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Run Automated Test Suite
        run: flutter test

      - name: Compile Flutter Web
        run: flutter build web --release --base-href "/Library-app/"

      - name: Upload Web Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
        continue-on-error: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true